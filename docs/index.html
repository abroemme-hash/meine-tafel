<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Meine Tafel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1f4d3a">
<style>
:root{
  --font:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --accent:#5b5bd6;--accent2:#7c6ae6;
  --bar:rgba(255,255,255,.94);--ink:#252b3b;--mute:#7a8296;
  --line:rgba(30,40,70,.09);--hover:rgba(30,40,70,.055);
  --shadow:0 10px 32px rgba(30,40,80,.12),0 1px 3px rgba(30,40,80,.08);
  --stagebg:linear-gradient(165deg,#f6f7fb 0%,#eceff5 100%);
  --wrapshadow:0 16px 44px rgba(30,40,80,.14),0 0 0 1px rgba(30,40,80,.07);
}
/* Umgebung dunkel (Schalter im Hilfsmittel-Menü) */
html.surround-dark{--accent:#8b8cf0;--accent2:#a08cf5;--bar:rgba(30,34,52,.92);--ink:#e9ecf6;--mute:#9aa2bb;--line:rgba(255,255,255,.1);--hover:rgba(255,255,255,.08);--shadow:0 12px 40px rgba(8,12,30,.35),0 2px 8px rgba(8,12,30,.18);--stagebg:radial-gradient(1300px 760px at 18% -10%,#2c3562 0%,#171c33 52%,#0d111f 100%);--wrapshadow:0 20px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--stagebg);font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:row}
#stage{flex:1;position:relative;min-height:0;min-width:0;display:flex;align-items:flex-start;justify-content:center;padding:12px;touch-action:none}
#wrap{position:relative;border-radius:16px;box-shadow:var(--wrapshadow)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;border-radius:16px}

.ic{width:24px;height:24px;flex:none;display:block}
button{font:inherit;font-size:12px;font-weight:500;letter-spacing:.01em;color:var(--ink);background:transparent;border:0;border-radius:14px;min-width:50px;min-height:58px;padding:6px 5px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;touch-action:manipulation;transition:background .15s,transform .1s,color .15s,box-shadow .15s}
button small{font-size:12px;font-weight:500;color:var(--mute);line-height:1;white-space:nowrap}
button b{font-size:17px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
@media(hover:hover){button:hover:not(:disabled):not(.on){background:var(--hover)}}
button:active:not(:disabled){transform:scale(.94)}
button:disabled{opacity:.3;cursor:default}
#tinfo:disabled{opacity:1}
button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 34%,transparent)}
button.on small{color:var(--accent)}

#barscroll{display:flex;flex-direction:column;align-items:stretch;max-height:var(--bmh,calc(100vh - 40px));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(120,130,160,.35) transparent}
#barscroll::-webkit-scrollbar{width:5px}#barscroll::-webkit-scrollbar-thumb{background:rgba(120,130,160,.35);border-radius:3px}
/* Werkzeugleiste: schmale Spalte am linken Rand (zweispaltig, nur Symbole) */
#bar{order:-1;position:relative;align-self:flex-start;margin:12px 0 12px 12px;width:max-content;background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:0;align-items:stretch;z-index:20}
body.right #bar{order:1;margin:12px 12px 12px 0}
.grp{display:grid;grid-template-columns:repeat(2,var(--bw));gap:2px;justify-items:center;align-items:center}
.grp+.grp{margin-top:5px;padding-top:5px;border-top:1px solid var(--line)}
#bar{--bw:44px}
#bar .grp>button{min-width:0;width:var(--bw);min-height:var(--bw);height:var(--bw);padding:2px;border-radius:12px}
#bar .grp>button small{display:none}
#bar .grp>button .ic{width:22px;height:22px}
#bar .grp>#pnum{grid-column:1/-1;width:100%;order:-1}
#bar .grp>#pnum small{display:block;font-size:10px}
#bar .grp>#pnum b{font-size:14px}
#tblgrp>button small,#tblgrp>#tinfo small{display:block!important;font-size:10px}
#tblgrp>#tinfo{grid-column:1/-1;width:100%!important;height:auto!important;min-height:40px!important}

.sw{min-width:0;min-height:0;width:20px;height:20px;border-radius:50%;padding:0;margin:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
#bar .grp>button.sw{width:20px;height:20px;min-height:0;padding:0;border-radius:50%}
.sw.more{background:conic-gradient(#e03131,#f2c200,#2f9e44,#1f6feb,#9c36b5,#e03131)}
.pop .sw.big{width:34px;height:34px;margin:3px}
#palpop{max-width:250px}
.sw.on{box-shadow:inset 0 0 0 2px rgba(0,0,0,.14),0 0 0 2px var(--bar),0 0 0 4px var(--accent)}
#colors{padding:4px 0;row-gap:10px}
.sz{min-width:0}
/* Beschriftungen zeigen (Schalter im Hilfsmittel-Menü) */
html.labels #bar{--bw:66px}
html.labels #bar .grp>button{height:auto;min-height:56px;gap:3px}
html.labels #bar .grp>button small{display:block;font-size:10.5px}
html.labels #bar .grp>button.sw{width:22px;min-height:0;height:22px}
html.labels #bar .grp>#pnum{height:auto}
@media(max-height:860px){#bar{--bw:38px}#bar .grp>button .ic{width:20px;height:20px}#bar .grp>button.sw{width:18px;height:18px}}
@media(max-height:700px){#bar{--bw:34px}#bar .grp>button .ic{width:18px;height:18px}#bar .grp>button.sw{width:16px;height:16px}}
.sz i{display:block;border-radius:50%;background:currentColor}
.chip{flex-direction:row;min-height:44px;min-width:0;padding:0 16px;font-size:14px;background:var(--hover)}
.chip small{font-size:14px;color:inherit}

.pop{position:absolute;top:0;left:calc(100% + 12px);max-height:var(--pmh,calc(100vh - 24px));overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin;width:max-content;max-width:min(calc(100vw - 140px),780px);background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line);border-radius:22px;padding:12px;display:none;gap:6px;flex-wrap:wrap;justify-content:center;box-shadow:var(--shadow)}
body.right .pop{left:auto;right:calc(100% + 12px)}
.pop.show{display:flex;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.pop h4{flex-basis:100%;margin:6px 6px 0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:600}
.pop h4:first-child{margin-top:0}

#panel{position:absolute;left:28px;top:28px;bottom:28px;width:184px;background:rgba(13,17,31,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:10px;overflow:auto;display:none;gap:10px;flex-direction:column;z-index:10;box-shadow:var(--shadow)}
#panel.show{display:flex}
#panel .th{position:relative;border:3px solid transparent;border-radius:11px;cursor:pointer;background:#fff;line-height:0;overflow:hidden;flex:none}
#panel .th.cur{border-color:#a5b4fc;box-shadow:0 0 0 2px var(--accent)}
#panel .th canvas{width:100%;height:auto;display:block}
#panel .th .x{position:absolute;right:5px;top:5px;min-width:0;min-height:0;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(13,17,31,.85);color:#fff;line-height:1}
#panel .th .x .ic{width:14px;height:14px}
#panel .th b{position:absolute;left:6px;top:6px;font-size:12px;background:rgba(13,17,31,.8);color:#fff;border-radius:999px;padding:2px 8px;line-height:1.3;min-width:0}

#ruler{position:absolute;left:140px;top:140px;width:756px;height:72px;background:linear-gradient(180deg,rgba(255,246,196,.94),rgba(255,226,120,.9));border:1px solid rgba(120,90,10,.55);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.35);display:none;z-index:8;cursor:grab;touch-action:none;transform-origin:50% 50%}
#ruler svg{position:absolute;inset:0;pointer-events:none}
#ruler .rb{position:absolute;bottom:5px;min-width:40px;min-height:30px;width:40px;height:30px;padding:0;border-radius:9px;background:rgba(255,255,255,.7);color:#3a3000}
#ruler .rb .ic{width:18px;height:18px}

#curtain{position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,#2a3560,#1a2142);border-radius:16px 16px 0 0;display:none;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#curtain .h{position:absolute;left:0;right:0;bottom:-20px;height:40px;display:flex;justify-content:center;align-items:center;cursor:ns-resize;touch-action:none}
#curtain .h span{width:120px;height:14px;border-radius:7px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4)}

@keyframes bl{to{opacity:.3}}

#txt{position:absolute;display:none;z-index:12;background:rgba(255,255,255,.55);border:2px dashed var(--accent);border-radius:6px;outline:none;resize:none;font-family:"Segoe UI",Arial,sans-serif;line-height:1.25;padding:0;margin:0;overflow:hidden;white-space:pre}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(20,24,40,.94);color:#fff;padding:12px 22px;border-radius:999px;z-index:99;display:none;font-size:15px;font-weight:500;box-shadow:var(--shadow)}
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="cv" width="1920" height="1080"></canvas>
    <textarea id="txt" rows="1" spellcheck="false"></textarea>
    <div id="curtain"><div class="h"><span></span></div></div>
  </div>
  <div id="panel"></div>
  <div id="ruler"></div>
</div>

<div id="bar">
  <div class="grp">
    <button id="undo"><i data-ic="undo"></i><small>Zurück</small></button>
    <button id="redo"><i data-ic="redo"></i><small>Vor</small></button>
  </div>
  <div class="grp" id="tools"></div>
  <div class="grp" id="colors"></div>
  <div class="grp" id="sizes"></div>
  <div class="grp" id="tblgrp" style="display:none">
    <button id="tinfo" disabled><b id="tinfot">4×3</b><small>Zeilen×Spalten</small></button>
    <button id="trm"><b>−</b><small>Zeile</small></button>
    <button id="trp"><b>+</b><small>Zeile</small></button>
    <button id="tkm"><b>−</b><small>Spalte</small></button>
    <button id="tkp"><b>+</b><small>Spalte</small></button>
  </div>
  <div class="grp" id="selgrp" style="display:none">
    <button id="sdel"><i data-ic="trash"></i><small>Löschen</small></button>
    <button id="sbig"><i data-ic="plus"></i><small>Größer</small></button>
    <button id="ssml"><i data-ic="minus"></i><small>Kleiner</small></button>
    <button id="sdup"><i data-ic="copy"></i><small>Kopie</small></button>
    <button id="slock"><i data-ic="lock"></i><small>Sperren</small></button>
  </div>
  <div class="grp">
    <button id="pprev" aria-label="Vorige Seite"><i data-ic="chevL"></i></button>
    <button id="pnum" data-pop="pgpop"><b id="pnumt">1 / 1</b><small>Seiten</small></button>
    <button id="pnext" aria-label="Nächste Seite"><i data-ic="chevR"></i></button>
    <button id="padd"><i data-ic="plus"></i><small>Neue Seite</small></button>
    <button id="pdel2"><i data-ic="trash"></i><small>Seite löschen</small></button>
  </div>
  <div class="grp">
    <button data-pop="aidpop"><i data-ic="wrench"></i><small>Hilfsmittel</small></button>
    <button data-pop="filepop"><i data-ic="folder"></i><small>Datei</small></button>
    <button id="dock"><i data-ic="dock"></i><small>Leiste</small></button>
  </div>

  <div class="pop" id="shapepop"></div>
  <div class="pop" id="palpop"></div>
  <div class="pop" id="covpop">
    <h4>Abdecken &amp; Vergrößern</h4>
    <button id="cur"><i data-ic="curtain"></i><small>Vorhang</small></button>
    <button data-tool="cover"><i data-ic="cover"></i><small>Abdeckung</small></button>
    <button id="lensb"><i data-ic="search"></i><small>Lupe</small></button>
    <button id="spotb"><i data-ic="eye"></i><small>Spot</small></button>
  </div>
  <div class="pop" id="geopop">
    <h4>Geometrie</h4>
    <button id="rul"><i data-ic="ruler"></i><small>Lineal</small></button>
    <button id="tri"><i data-ic="triangle"></i><small>Geodreieck</small></button>
    <button data-tool="zirkel"><i data-ic="compass"></i><small>Zirkel</small></button>
  </div>
  <div class="pop" id="pgpop">
    <button id="pdel"><i data-ic="trash"></i><small>Seite löschen</small></button>
    <button id="pclr"><i data-ic="eraser"></i><small>Seite leeren</small></button>
    <button id="pthumbs"><i data-ic="grid"></i><small>Übersicht</small></button>
    <button id="punlock"><i data-ic="unlock"></i><small>Alles entsperren</small></button>
  </div>
  <div class="pop" id="aidpop">
    <h4>Hintergrund</h4>
    <div id="bgs" style="display:contents"></div>
    <h4>Hilfsmittel</h4>
    <button id="mtc"><i data-ic="hand"></i><small>Mehrfach-Touch</small></button>
    <button id="snp"><i data-ic="line"></i><small>Gerade Linie</small></button>
    <h4>Ansicht</h4>
    <button id="lbl"><i data-ic="tag"></i><small>Beschriftungen</small></button>
    <button id="srf"><i data-ic="sun"></i><small>Umgebung hell/dunkel</small></button>
    <button id="intr"><i data-ic="help"></i><small>Einführung</small></button>
    <button id="tim"><i data-ic="timer"></i><small>Timer</small></button>
    <button id="thm"><i data-ic="contrast"></i><small>Tafel-Design</small></button>
  </div>
  <div class="pop" id="filepop">
    <button id="fnew"><i data-ic="filePlus"></i><small>Neue Tafel</small></button>
    <button id="fopen"><i data-ic="folderOpen"></i><small>Öffnen</small></button>
    <button id="fsave"><i data-ic="save"></i><small>Speichern</small></button>
    <button id="fpng"><i data-ic="image"></i><small>Als Bild</small></button>
    <button id="fpdf"><i data-ic="printer"></i><small>Drucken / PDF</small></button>
    <button id="fimp"><i data-ic="fileText"></i><small>PDF laden</small></button>
    <button id="ffull"><i data-ic="maximize"></i><small>Vollbild</small></button>
  </div>
</div>

<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="filePdf" accept="application/pdf" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<div id="toast"></div>

<script>
'use strict';
const W=1920;let H=1080;
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),wrap=$('#wrap'),stage=$('#stage');
const uid=()=>Math.random().toString(36).slice(2,10);
/* Symbole (Linien-Icons) */
const ICONS={
select:'<path d="M4 4l7.07 17 2.51-7.39L21 11.07z"/>',

shape:'<path d="M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3.5"/>',
text:'<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/>',
image:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
rect:'<rect width="18" height="18" x="3" y="3" rx="2"/>',
ellipse:'<circle cx="12" cy="12" r="9"/>',
table:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M12 3v18"/>',
tag:'<path d="M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0 0-2 2v7.17a2 2 0 0 0 .59 1.41l8.7 8.7a2.43 2.43 0 0 0 3.42 0l6.58-6.58a2.43 2.43 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".6" fill="currentColor"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',

compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',

lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
unlock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
triangle:'<path d="M3 20 12 4l9 16Z"/><path d="M8 20a4 4 0 0 1 8 0"/>',
hand:'<path d="M18 11V6a2 2 0 0 0-4 0v1"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3.2-2.4L8 15"/>',

plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',

copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
chevL:'<path d="m15 18-6-6 6-6"/>',

folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',

function drawBg(c,bg,board){
  const col=board?'rgba(255,255,255,.22)':'#c5d3e0',dark=board?'rgba(255,255,255,.7)':'#556';
  c.save();c.lineWidth=2;c.strokeStyle=col;c.fillStyle=dark;
  const L=(x1,y1,x2,y2)=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()};
  if(bg==='grid'){for(let x=0;x<=W;x+=40)L(x,0,x,H);for(let y=0;y<=H;y+=40)L(0,y,W,y)}
  else if(bg==='lined'){for(let y=100;y<H;y+=70)L(60,y,W-60,y);c.strokeStyle=board?'rgba(255,120,120,.5)':'#f1a3a3';L(120,0,120,H)}
  else if(bg==='lin1'){
    // weite Lineatur für Klasse 1: Grundlinie, Mittellinie (gestrichelt), Ober- und Unterlinie
    for(let y0=40;y0+270<=H;y0+=300){
      c.fillStyle=board?'rgba(255,255,255,.07)':'rgba(255,225,110,.25)';c.fillRect(60,y0+90,W-120,90);
      c.strokeStyle=col;c.lineWidth=2;L(60,y0,W-60,y0);L(60,y0+270,W-60,y0+270);
      c.setLineDash([16,12]);L(60,y0+90,W-60,y0+90);c.setLineDash([]);
      c.strokeStyle=board?'rgba(255,255,255,.65)':'#d84a4a';c.lineWidth=3;L(60,y0+180,W-60,y0+180)}
  }
  else if(bg==='lines4'){
    for(let y0=70;y0+180<H;y0+=260){
      c.fillStyle=board?'rgba(255,255,255,.07)':'rgba(255,225,110,.22)';c.fillRect(60,y0+60,W-120,60);
      c.strokeStyle=col;c.lineWidth=2;L(60,y0,W-60,y0);L(60,y0+180,W-60,y0+180);
      c.setLineDash([14,10]);L(60,y0+60,W-60,y0+60);c.setLineDash([]);
      c.strokeStyle=board?'rgba(255,255,255,.6)':'#6b7b8c';c.lineWidth=3;L(60,y0+120,W-60,y0+120)}
  }
  else if(bg==='numline'){
    const x0=120,st=84,y=560;c.strokeStyle=dark;c.lineWidth=5;L(x0-40,y,x0+st*20+40,y);
    c.font='bold 34px "Segoe UI",sans-serif';c.textAlign='center';
    for(let i=0;i<=20;i++){const x=x0+i*st;c.lineWidth=i%5===0?5:3;L(x,y-(i%5===0?28:18),x,y+(i%5===0?28:18));c.fillText(i,x,y+75)}
  }
  else if(bg==='hundred'){
    const s=80,x0=(W-10*s)/2,y0=(H-10*s)/2;c.font='26px "Segoe UI",sans-serif';c.textAlign='center';c.textBaseline='middle';
    for(let r=0;r<10;r++)for(let k=0;k<10;k++){c.strokeStyle=dark;c.lineWidth=2;c.strokeRect(x0+k*s,y0+r*s,s,s);c.globalAlpha=.4;c.fillText(r*10+k+1,x0+k*s+s/2,y0+r*s+s/2);c.globalAlpha=1}
  }
  else if(bg==='coords'){
    const o={x:W/2,y:H/2},u=50;c.strokeStyle=col;for(let i=-10;i<=10;i++){L(o.x+i*u,o.y-10*u,o.x+i*u,o.y+10*u);L(o.x-10*u,o.y+i*u,o.x+10*u,o.y+i*u)}
    c.strokeStyle=dark;c.lineWidth=4;L(o.x-10*u-20,o.y,o.x+10*u+20,o.y);L(o.x,o.y-10*u-20,o.x,o.y+10*u+20);
    c.font='20px "Segoe UI",sans-serif';c.textAlign='center';c.textBaseline='top';
    for(let i=-10;i<=10;i++){if(!i)continue;c.fillText(i,o.x+i*u,o.y+6);c.textAlign='right';c.textBaseline='middle';c.fillText(-i,o.x-6,o.y+i*u);c.textAlign='center';c.textBaseline='top'}
  }
  c.restore();
}
function drawObj(c,o){
  c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=o.c;c.fillStyle=o.c;c.lineWidth=o.w;
  if(o.t==='path'){
    if(o.hl){c.globalAlpha=.4;c.lineCap='butt'}
    const p=o.pts;c.beginPath();
    if(p.length===1){c.arc(p[0][0],p[0][1],o.w/2,0,7);c.fill()}
    else{c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++){c.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2)}c.lineTo(p[p.length-1][0],p[p.length-1][1]);c.stroke()}
  }else if(o.t==='line'||o.t==='arrow'){
    c.beginPath();c.moveTo(o.x1,o.y1);c.lineTo(o.x2,o.y2);c.stroke();
    if(o.t==='arrow'){const a=Math.atan2(o.y2-o.y1,o.x2-o.x1),h=Math.max(24,o.w*4);c.beginPath();c.moveTo(o.x2,o.y2);c.lineTo(o.x2-h*Math.cos(a-.45),o.y2-h*Math.sin(a-.45));c.moveTo(o.x2,o.y2);c.lineTo(o.x2-h*Math.cos(a+.45),o.y2-h*Math.sin(a+.45));c.stroke()}
  }else if(o.t==='rect'){c.strokeRect(Math.min(o.x1,o.x2),Math.min(o.y1,o.y2),Math.abs(o.x2-o.x1),Math.abs(o.y2-o.y1))}
  else if(o.t==='table'){
    const x=Math.min(o.x1,o.x2),y=Math.min(o.y1,o.y2),w=Math.abs(o.x2-o.x1),h=Math.abs(o.y2-o.y1);
    c.strokeRect(x,y,w,h);c.beginPath();
    for(let i=1;i<o.r;i++){c.moveTo(x,y+h*i/o.r);c.lineTo(x+w,y+h*i/o.r)}
    for(let i=1;i<o.k;i++){c.moveTo(x+w*i/o.k,y);c.lineTo(x+w*i/o.k,y+h)}
    c.stroke()}
  else if(o.t==='cover'){
    const x=Math.min(o.x1,o.x2),y=Math.min(o.y1,o.y2),w=Math.abs(o.x2-o.x1),h=Math.abs(o.y2-o.y1),g=c.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0,'#33407a');g.addColorStop(1,'#1c2348');c.fillStyle=g;c.fillRect(x,y,w,h);
    c.fillStyle='rgba(255,255,255,.85)';c.font=`700 ${Math.max(24,Math.min(w,h)*.4)}px "Segoe UI",sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('?',x+w/2,y+h/2)}
  else if(o.t==='ellipse'){c.beginPath();c.ellipse((o.x1+o.x2)/2,(o.y1+o.y2)/2,Math.abs(o.x2-o.x1)/2||1,Math.abs(o.y2-o.y1)/2||1,0,0,7);c.stroke()}
  else if(o.t==='text'){c.font=`${o.size}px "Segoe UI",Arial,sans-serif`;c.textBaseline='top';o.s.split('\n').forEach((l,i)=>c.fillText(l,o.x,o.y+i*o.size*1.25))}
  else if(o.t==='img'){const im=getImg(o.id);if(im)c.drawImage(im,o.x,o.y,o.w,o.h);else{c.strokeRect(o.x,o.y,o.w,o.h)}}
  c.restore();
}
function bbox(o){
  let a,b,c2,d,pad=0;
  if(o.t==='path'){a=Infinity;b=Infinity;c2=-Infinity;d=-Infinity;o.pts.forEach(p=>{a=Math.min(a,p[0]);b=Math.min(b,p[1]);c2=Math.max(c2,p[0]);d=Math.max(d,p[1])});pad=o.w/2}
  else if(o.t==='text'){ctx.font=`${o.size}px "Segoe UI",Arial,sans-serif`;const ls=o.s.split('\n');a=o.x;b=o.y;c2=o.x+Math.max(...ls.map(l=>ctx.measureText(l).width));d=o.y+ls.length*o.size*1.25}
  else if(o.t==='img'){a=o.x;b=o.y;c2=o.x+o.w;d=o.y+o.h}
  else{a=Math.min(o.x1,o.x2);b=Math.min(o.y1,o.y2);c2=Math.max(o.x1,o.x2);d=Math.max(o.y1,o.y2);pad=o.w/2}
  return [a-pad,b-pad,c2+pad,d+pad];
}
function render(c,page,withSel){
  const board=S.theme==='board';
  c.fillStyle=board?'#1f4d3a':'#ffffff';c.fillRect(0,0,W,H);
  drawBg(c,page.bg,board);
  if(page.bgImg){const im=getImg(page.bgImg);if(im){const r=Math.min(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*r,h=im.naturalHeight*r;c.drawImage(im,(W-w)/2,(H-h)/2,w,h)}}
  // Datum (und ggf. Klasse · Thema) oben auf jeder Seite
  c.save();c.fillStyle=board?'rgba(255,255,255,.92)':'#1e2433';c.textBaseline='top';
  c.font='700 64px "Segoe UI",Arial,sans-serif';c.textAlign='right';c.fillText(page.date||todayStr(),W-48,30);
  if(window.__kopfText){c.font='600 48px "Segoe UI",Arial,sans-serif';c.textAlign='left';c.globalAlpha=.8;c.fillText(window.__kopfText,48,38)}
  c.restore();
  if(withSel&&!page.objs.length&&!page.bgImg&&!draft){c.save();c.fillStyle=board?'rgba(255,255,255,.42)':'rgba(90,100,125,.42)';c.font='500 44px "Segoe UI",Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('Stift wählen und losschreiben – oder Widgets öffnen',W/2,H/2);c.restore()}
  page.objs.forEach(o=>drawObj(c,o));
  if(withSel&&draft)drawObj(c,draft);
  if(withSel){Object.values(multi).forEach(d=>drawObj(c,d));
    if(draft&&draft.cx!=null){c.save();c.strokeStyle='#1f6feb';c.lineWidth=3;c.setLineDash([10,8]);c.beginPath();c.moveTo(draft.cx,draft.cy);c.lineTo(draft.px==null?draft.cx:draft.px,draft.py==null?draft.cy:draft.py);c.stroke();c.setLineDash([]);c.fillStyle='#1f6feb';c.beginPath();c.arc(draft.cx,draft.cy,6,0,7);c.fill();c.restore()}}
  if(withSel&&sel!=null&&page.objs[sel]){const o=page.objs[sel],b=bbox(o);c.save();c.strokeStyle='#1f6feb';c.lineWidth=3;c.setLineDash([12,8]);c.strokeRect(b[0]-8,b[1]-8,b[2]-b[0]+16,b[3]-b[1]+16);
    if(RESIZABLE.includes(o.t)){c.setLineDash([]);c.fillStyle='#1f6feb';c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(b[2]+8,b[3]+8,15,0,7);c.fill();c.stroke()}   // Griff zum Vergrößern/Verkleinern
    c.restore()}
}

const RESIZABLE=['img','rect','ellipse','table','cover'];
function hit(x,y){const o=P().objs;for(let i=o.length-1;i>=0;i--){if(o[i].lock)continue;const b=bbox(o[i]);if(x>=b[0]-12&&x<=b[2]+12&&y>=b[1]-12&&y<=b[3]+12)return i}return -1}
function near(o,x,y,r){
  if(o.t==='path')return o.pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<r+o.w/2);
  const b=bbox(o);return x>=b[0]-r&&x<=b[2]+r&&y>=b[1]-r&&y<=b[3]+r}
function move(o,dx,dy){
  if(o.t==='path')o.pts.forEach(p=>{p[0]+=dx;p[1]+=dy});
  else if(o.t==='text'||o.t==='img'){o.x+=dx;o.y+=dy}
  else{o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}}
function scaleObj(o,f){
  const b=bbox(o),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,s=(v,c0)=>c0+(v-c0)*f;
  if(o.t==='path')o.pts.forEach(p=>{p[0]=s(p[0],cx);p[1]=s(p[1],cy)});
  else if(o.t==='text'){o.size=Math.max(14,o.size*f);o.x=s(o.x,cx);o.y=s(o.y,cy)}
  else if(o.t==='img'){o.x=s(o.x,cx);o.y=s(o.y,cy);o.w*=f;o.h*=f}
  else{o.x1=s(o.x1,cx);o.x2=s(o.x2,cx);o.y1=s(o.y1,cy);o.y2=s(o.y2,cy)}}
function eraseAt(p){const pg=P(),n=pg.objs.length;pg.objs=pg.objs.filter(o=>o.lock||!near(o,p.x,p.y,26));if(pg.objs.length!==n){moved=true;sel=null;dirty=true}}

/* Kanten von Lineal und Geodreieck in Tafel-Koordinaten (für das Einrasten des Stifts) */
function edgesLogical(){
  const r=cv.getBoundingClientRect(),segs=[];
  const one=(el,loc)=>{
    if(!el||getComputedStyle(el).display==='none')return;
    const sr=el.offsetParent.getBoundingClientRect(),cs=getComputedStyle(el),or=cs.transformOrigin.split(' ').map(parseFloat);
    const m=/rotate\((-?[\d.]+)deg\)/.exec(el.style.transform||''),a=(m?+m[1]:0)*Math.PI/180,co=Math.cos(a),si=Math.sin(a);
    const T=([x,y])=>{const dx=x-or[0],dy=y-or[1];return{x:(sr.left+el.offsetLeft+or[0]+dx*co-dy*si-r.left)*W/r.width,y:(sr.top+el.offsetTop+or[1]+dx*si+dy*co-r.top)*H/r.height}};
    loc(el.offsetWidth,el.offsetHeight).forEach(([p,q])=>{const A=T(p),B=T(q);segs.push({ax:A.x,ay:A.y,bx:B.x,by:B.y})});
  };
  one($('#ruler'),(w,h)=>[[[0,0],[w,0]],[[0,h],[w,h]]]);
  one($('#geo'),(w,h)=>[[[4,h-4],[w-4,h-4]],[[4,h-4],[w/2,4]],[[w-4,h-4],[w/2,4]]]);
  return segs;
}
let actType='mouse',hold=null,multiOn=false,snapOn=false;
const multi={};   // zusätzliche Finger-Striche (Mehrfach-Touch), je Finger eine Farbe
const MC=['#e03131','#1f6feb','#2f9e44','#f08c00','#9c36b5','#0ca678'];
cv.addEventListener('pointerdown',e=>{
  if(act!=null&&act!==e.pointerId&&multiOn&&e.pointerType==='touch'&&actType==='touch'&&(tool==='pen'||tool==='hl')&&!multi[e.pointerId]){
    e.preventDefault();const p=pos(e),k=Object.keys(multi).length;cv.setPointerCapture(e.pointerId);
    multi[e.pointerId]={t:'path',pts:[[p.x,p.y]],c:tool==='hl'?NEON_COL[(k+1)%NEON_COL.length]:MC[k%MC.length],w:tool==='hl'?PEN[sizeIdx]*3.5:PEN[sizeIdx],hl:tool==='hl'};dirty=true;return}
  if(act!=null)return;
  if(e.pointerType==='pen')lastPen=Date.now();
  if(e.pointerType==='touch'&&Date.now()-lastPen<1500)return;
  hideAllPops();
  e.preventDefault();
  const p=pos(e);act=e.pointerId;actType=e.pointerType;moved=false;cv.setPointerCapture(e.pointerId);
  if(tool==='text'){act=null;openText(p.x,p.y);return}
  if(tool==='select'){
    // Größe ändern: Griff unten rechts am ausgewählten Bild / an der ausgewählten Form
    const so=sel!=null?P().objs[sel]:null;
    if(so&&RESIZABLE.includes(so.t)){const b=bbox(so);if(Math.hypot(p.x-(b[2]+8),p.y-(b[3]+8))<34){draft={resize:so,ratio:so.t==='img'?so.h/so.w:0};ui();dirty=true;return}}
    const i=hit(p.x,p.y);sel=i>=0?i:null;draft=i>=0?{drag:p}:null;ui();dirty=true;return}
  if(tool==='eraser'){eraseAt(p);return}
  const w=tool==='hl'?PEN[sizeIdx]*3.5:PEN[sizeIdx];
  if(tool==='pen'||tool==='hl'){
    draft={t:'path',pts:[[p.x,p.y]],c:tool==='hl'?hlColor:color,w,hl:tool==='hl'};
    // Stift an Lineal/Geodreieck: Strich rastet an der Kante ein und wird eine dünne graue Bleistiftlinie
    if(tool==='pen'){
      let best=null,bd=40;
      edgesLogical().forEach(s=>{const dx=s.bx-s.ax,dy=s.by-s.ay,t=Math.max(0,Math.min(1,((p.x-s.ax)*dx+(p.y-s.ay)*dy)/(dx*dx+dy*dy))),qx=s.ax+t*dx,qy=s.ay+t*dy,d=Math.hypot(p.x-qx,p.y-qy);if(d<bd){bd=d;best={s,qx,qy}}});
      if(best){draft.edge=best.s;draft.pts=[[best.qx,best.qy],[best.qx,best.qy]];draft.c=pencil();draft.w=3}
    }
  }
  else if(tool==='zirkel')draft={t:'ellipse',cx:p.x,cy:p.y,x1:p.x,y1:p.y,x2:p.x,y2:p.y,c:pencil(),w:3};   // Zirkel: dünne graue Linie
  else{draft={t:tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y,c:color,w:PEN[sizeIdx]};if(tool==='table'){draft.r=tblR;draft.k=tblK;draft.c=pencil();draft.w=3}}   // Tabellen: dünne graue „Bleistift“-Linie
  dirty=true;
});
cv.addEventListener('pointermove',e=>{
  const mu=multi[e.pointerId];
  if(mu){const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];for(const ev of evs.length?evs:[e]){const p=pos(ev);mu.pts.push([p.x,p.y])}dirty=true;return}
  if(act!==e.pointerId)return;
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];
  for(const ev of evs.length?evs:[e]){
    const p=pos(ev);
    if(tool==='eraser'){eraseAt(p)}
    else if(tool==='select'){
      if(draft&&draft.drag&&sel!=null){move(P().objs[sel],p.x-draft.drag.x,p.y-draft.drag.y);draft.drag=p;moved=true}
      else if(draft&&draft.resize){
        const o=draft.resize;
        if(o.t==='img'){o.w=Math.max(60,p.x-o.x);o.h=o.w*draft.ratio}
        else{if(o.x1>=o.x2)o.x1=Math.max(o.x2+20,p.x);else o.x2=Math.max(o.x1+20,p.x);if(o.y1>=o.y2)o.y1=Math.max(o.y2+20,p.y);else o.y2=Math.max(o.y1+20,p.y)}
        moved=true}
    }
    else if(draft){
      if(draft.t==='path'){
        if(draft.edge){const s=draft.edge,dx=s.bx-s.ax,dy=s.by-s.ay,t=Math.max(0,Math.min(1,((p.x-s.ax)*dx+(p.y-s.ay)*dy)/(dx*dx+dy*dy)));draft.pts[1]=[s.ax+t*dx,s.ay+t*dy]}
        else if(draft.straight)draft.pts[1]=[p.x,p.y];else draft.pts.push([p.x,p.y])}
      else if(tool==='zirkel'){const r=Math.hypot(p.x-draft.cx,p.y-draft.cy);draft.x1=draft.cx-r;draft.y1=draft.cy-r;draft.x2=draft.cx+r;draft.y2=draft.cy+r;draft.px=p.x;draft.py=p.y}
      else{draft.x2=p.x;draft.y2=p.y}
    }
  }
  // Stift kurz ruhig halten → Strich wird zur geraden Linie (wenn „Gerade Linie“ eingeschaltet ist)
  clearTimeout(hold);
  if(snapOn&&draft&&draft.t==='path'&&!draft.hl&&!draft.straight)hold=setTimeout(()=>{if(draft&&draft.t==='path'&&!draft.straight&&draft.pts.length>6){draft.pts=[draft.pts[0],draft.pts[draft.pts.length-1]];draft.straight=true;dirty=true}},520);
  dirty=true;
});
function up(e){
  if(multi[e.pointerId]){const d=multi[e.pointerId];delete multi[e.pointerId];if(d.pts.length>1){P().objs.push(d);snap()}dirty=true;return}
  if(act!==e.pointerId)return;act=null;clearTimeout(hold);
  if(tool==='select'){const o=sel!=null?P().objs[sel]:null;draft=null;if(moved)snap();else if(o&&o.t==='cover'){P().objs.splice(sel,1);sel=null;snap()}}
  else if(tool==='eraser'){if(moved)snap();ui()}
  else if(draft){
    const d=draft;draft=null;
    const tiny=d.t!=='path'&&Math.hypot(d.x2-d.x1,d.y2-d.y1)<6;
    delete d.px;delete d.py;delete d.edge;
    if(!tiny){P().objs.push(d);if(d.t==='table'){sel=P().objs.length-1;tool='select';toolsUI()}snap()}
  }
  dirty=true;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ---------- Text ---------- */
const txt=$('#txt');let txtPos=null;
function openText(x,y,size){
  closeText(true);const sz=size||TXT[sizeIdx];txtPos={x,y,size:sz};
  txt.style.display='block';txt.style.left=x*scale+'px';txt.style.top=y*scale+'px';
  txt.style.fontSize=sz*scale+'px';txt.style.color=color;txt.style.width=Math.max(160,(W-x)*scale*.6)+'px';txt.style.height=sz*1.25*scale+8+'px';
  txt.value='';setTimeout(()=>txt.focus(),40);
}
function closeText(commit){
  if(txt.style.display!=='block')return;
  const v=txt.value.replace(/\s+$/,'');txt.style.display='none';
  if(commit&&v&&txtPos){P().objs.push({t:'text',x:txtPos.x,y:txtPos.y,s:v,c:color,size:txtPos.size||TXT[sizeIdx],w:1});snap()}
  txtPos=null;
}
txt.addEventListener('input',()=>{const n=txt.value.split('\n').length;txt.style.height=(n*((txtPos&&txtPos.size)||TXT[sizeIdx])*1.25*scale+8)+'px'});
/* Doppelklick in eine Tabellenzelle: Text direkt in die Zelle schreiben */
cv.addEventListener('dblclick',e=>{
  if(tool!=='select')return;const p=pos(e),i=hit(p.x,p.y),o=i>=0?P().objs[i]:null;
  if(!o||o.t!=='table')return;
  const x=Math.min(o.x1,o.x2),y=Math.min(o.y1,o.y2),w=Math.abs(o.x2-o.x1),h=Math.abs(o.y2-o.y1),cw=w/o.k,ch=h/o.r;
  const col=Math.max(0,Math.min(o.k-1,Math.floor((p.x-x)/cw))),row=Math.max(0,Math.min(o.r-1,Math.floor((p.y-y)/ch)));
  const size=Math.max(20,Math.min(TXT[sizeIdx],Math.round(ch*.55)));
  openText(x+col*cw+10,y+row*ch+(ch-size*1.25)/2,size);
});
txt.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'){txt.value='';closeText(false)}else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){closeText(true)}});
txt.addEventListener('blur',()=>closeText(true));

/* ---------- Bilder ---------- */
function addImage(src){
  const im=new Image();im.onload=()=>{
    const id=uid();let w=im.naturalWidth,h=im.naturalHeight;const f=Math.min(1,900/w,700/h);w*=f;h*=f;
    S.images[id]=src;imgCache[id]=im;
    P().objs.push({t:'img',id,x:(W-w)/2,y:(H-h)/2,w,h});sel=P().objs.length-1;tool='select';snap();toolsUI();
  };im.onerror=()=>toast('Bild konnte nicht geladen werden');im.src=src}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
// Große Bilder verkleinern, damit der Speicher nicht überläuft
async function shrink(f){const src=await fileToDataURL(f);if(f.size<600000)return src;
  return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=im.naturalWidth*k;c.height=im.naturalHeight*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.88))};im.onerror=()=>res(src);im.src=src})}
$('#fileImg').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)addImage(await shrink(f))};
addEventListener('paste',async e=>{if(e.target===txt)return;for(const it of e.clipboardData.items){if(it.type.startsWith('image/')){addImage(await shrink(it.getAsFile()));e.preventDefault();return}}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;if(f.type.startsWith('image/'))addImage(await shrink(f));else if(f.type==='application/pdf')importPdf(f)});

/* ---------- PDF importieren (pdf.js liegt lokal in lib/) ---------- */
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('Skript nicht erreichbar'));document.head.appendChild(s)})}
async function importPdf(file){
  try{
    toast('PDF wird geladen …',60000);
    if(!window.pdfjsLib){await loadScript('lib/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js'}
    const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const n=Math.min(doc.numPages,60),first=S.pages.length;
    for(let i=1;i<=n;i++){
      toast(`PDF Seite ${i} / ${n} …`,60000);
      const pg=await doc.getPage(i),vp0=pg.getViewport({scale:1}),sc=Math.min(W/vp0.width,H/vp0.height)*1.3,vp=pg.getViewport({scale:sc});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      const id=uid();S.images[id]=c.toDataURL('image/jpeg',.85);
      S.pages.push(mkPage('plain',[],id));
    }
    setPage(first);toast(doc.numPages>60?'Nur die ersten 60 Seiten geladen':'PDF geladen');
  }catch(err){toast('PDF konnte nicht geladen werden: '+err.message,5000)}
}
$('#filePdf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importPdf(f)};

/* ---------- Speichern ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('tafel',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kvSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function kvGet(k){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function serialize(){
  const used=new Set();S.pages.forEach(p=>{if(p.bgImg)used.add(p.bgImg);p.objs.forEach(o=>o.t==='img'&&used.add(o.id))});
  const images={};used.forEach(id=>images[id]=S.images[id]);
  return JSON.stringify({v:1,theme:S.theme,cur:S.cur,images,pages:S.pages.map(p=>({bg:p.bg,bgImg:p.bgImg,date:p.date,objs:p.objs}))})}
function restore(json){
  const d=typeof json==='string'?JSON.parse(json):json;
  if(!d||!Array.isArray(d.pages)||!d.pages.length)throw new Error('Ungültige Datei');
  S.theme=d.theme==='board'?'board':'white';S.images=d.images||{};
  Object.keys(imgCache).forEach(k=>delete imgCache[k]);
  S.pages=d.pages.map(p=>mkPage(p.bg||'plain',Array.isArray(p.objs)?p.objs:[],p.bgImg||null,p.date||null));
  S.cur=Math.min(d.cur||0,S.pages.length-1);sel=null;draft=null;applyTheme();changed()}
let st;function scheduleSave(){clearTimeout(st);st=setTimeout(()=>kvSet('state',serialize()).catch(()=>toast('Automatisches Speichern nicht möglich')),700)}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
$('#fsave').onclick=()=>{download(`tafel-${stamp()}.tafel.json`,new Blob([serialize()],{type:'application/json'}));toast('Gespeichert (Download)')};
$('#fopen').onclick=()=>$('#fileJson').click();
$('#fileJson').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{restore(await f.text());toast('Geöffnet')}catch(err){toast('Datei konnte nicht geöffnet werden')}};
$('#fnew').onclick=()=>{if(confirm('Neue leere Tafel? Die aktuelle Tafel geht verloren (vorher speichern!).')){S.pages=[mkPage('plain')];S.images={};S.cur=0;sel=null;changed()}};
$('#fpng').onclick=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;render(c.getContext('2d'),P(),false);c.toBlob(b=>download(`tafel-seite${S.cur+1}.png`,b))};
$('#fpdf').onclick=()=>{
  const w=window.open('','_blank');if(!w){toast('Pop-up wurde blockiert');return}
  const imgs=S.pages.map(p=>{const c=document.createElement('canvas');c.width=W;c.height=H;render(c.getContext('2d'),p,false);return c.toDataURL('image/jpeg',.9)});
  w.document.write('<!doctype html><title>Tafel</title><style>@page{size:A4 landscape;margin:0}body{margin:0}img{display:block;max-width:100%;max-height:100vh;margin:0 auto;page-break-after:always}</style>'+imgs.map(s=>`<img src="${s}">`).join(''));
  w.document.close();w.onload=()=>setTimeout(()=>w.print(),300);
};
$('#fimp').onclick=()=>$('#filePdf').click();
$('#ffull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};

/* ---------- Oberfläche ---------- */
const TOOLS=[['select','select','Auswahl'],['pen','pen','Stift'],['hl','hl','Marker'],['eraser','eraser','Radierer'],['shape','shape','Formen'],['text','text','Text'],['img','image','Bild']];
const SHAPES=[['rect','rect','Rechteck'],['ellipse','ellipse','Kreis'],['line','line','Linie'],['arrow','arrow','Pfeil'],['table','table','Tabelle']];
function buildBar(){
  $('#tools').innerHTML=TOOLS.map(([id,icon,l])=>`<button data-tool="${id}">${ic(icon)}<small>${l}</small></button>`).join('')
    +`<button id="geobtn" data-pop="geopop">${ic('ruler')}<small>Geometrie</small></button>`   // Lineal, Geodreieck, Zirkel
    +`<button id="covbtn" data-pop="covpop">${ic('eye')}<small>Abdecken</small></button>`;   // Vorhang, Abdeckung, Lupe, Spot
  $('#palpop').innerHTML='<h4>Weitere Farben</h4>'+PALETTE.map(c=>`<button class="sw big" data-color="${c}" style="background:${c}" aria-label="Farbe ${c}"></button>`).join('');
  buildColors();
  $('#sizes').innerHTML=PEN.map((s,i)=>`<button class="sz" data-size="${i}"><i style="width:${6+i*7}px;height:${6+i*7}px"></i><small>${['dünn','mittel','dick'][i]}</small></button>`).join('');
  $('#shapepop').innerHTML=SHAPES.map(([id,icon,l])=>`<button data-tool="${id}">${ic(icon)}<small>${l}</small></button>`).join('');
  $('#bgs').innerHTML=BGS.map(([id,l])=>`<button class="chip" data-bg="${id}"><small>${l.replace('-','')}</small></button>`).join('');
}
function buildColors(){
  let list;
  if(tool==='hl')list=NEON_COL;
  else{
    const first=S.theme==='board'?'#ffffff':BASE_COL[0];
    list=[first,...BASE_COL.slice(1)];
    if(!list.includes(color))list.push(color);   // aus der Palette gewählte Farbe bleibt sichtbar
  }
  $('#colors').innerHTML=list.map(c=>`<button class="sw" data-color="${c}" style="background:${c}" aria-label="Farbe ${c}"></button>`).join('')
    +(tool==='hl'?'':`<button class="sw more" data-pop="palpop" style="background:conic-gradient(#e03131,#f2c200,#2f9e44,#1f6feb,#9c36b5,#e03131)" title="Weitere Farben" aria-label="Weitere Farben"></button>`);
}
function toolsUI(){
  buildColors();
  document.querySelectorAll('[data-tool]').forEach(b=>{const id=b.dataset.tool;b.classList.toggle('on',id===tool||(id==='shape'&&SHAPES.some(s=>s[0]===tool)))});
  $('#geobtn').classList.toggle('on',tool==='zirkel');
  $('#covbtn').classList.toggle('on',tool==='cover');
  const ac=tool==='hl'?hlColor:color;
  document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('on',b.dataset.color===ac));
  document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('on',+b.dataset.size===sizeIdx));
  cv.style.cursor=tool==='select'?'default':tool==='text'?'text':tool==='eraser'?'cell':'crosshair';
  ui();
}
function ui(){
  const p=P();
  $('#pnumt').textContent=`${S.cur+1} / ${S.pages.length}`;
  $('#pprev').disabled=S.cur===0;$('#pnext').disabled=S.cur>=S.pages.length-1;
  $('#undo').disabled=p.hi<=0;$('#redo').disabled=p.hi>=p.hist.length-1;
  $('#selgrp').style.display=sel!=null?'grid':'none';
  {const dr=['pen','hl','rect','ellipse','line','arrow','table','zirkel','text'],so0=sel!=null?p.objs[sel]:null;
   $('#colors').style.display=(dr.includes(tool)||(tool==='select'&&so0&&so0.c))?'':'none';
   $('#sizes').style.display=dr.includes(tool)?'':'none'}
  const so=sel!=null?p.objs[sel]:null,st=so&&so.t==='table'?so:null;
  $('#tblgrp').style.display=(tool==='table'||st)?'grid':'none';
  $('#tinfot').textContent=(st?st.r:tblR)+'×'+(st?st.k:tblK);
  document.querySelectorAll('[data-bg]').forEach(b=>b.classList.toggle('on',b.dataset.bg===p.bg));
  dirty=true;
}
/* Menü neben dem angeklickten Knopf platzieren und im Fenster halten */
let uiScale=1;
function placePop(el,btn){
  const z=uiScale||1,bar=$('#bar').getBoundingClientRect(),b=btn.getBoundingClientRect();
  let top=(b.top-bar.top)/z;el.style.top=top+'px';
  const r=el.getBoundingClientRect();
  const over=r.bottom-(innerHeight-8);if(over>0)top-=over/z;
  if(top<(8-bar.top)/z)top=(8-bar.top)/z;
  el.style.top=top+'px';
}
function hideAllPops(except){document.querySelectorAll('.pop').forEach(p=>{if(p.id!==except)p.classList.remove('show')})}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t){return}
  if(t.dataset.pop){const el=document.getElementById(t.dataset.pop);const open=!el.classList.contains('show');hideAllPops();el.classList.toggle('show',open);if(open)placePop(el,t);return}
  if(t.dataset.tool){
    const id=t.dataset.tool;
    if(id==='shape'){const el=$('#shapepop');const open=!el.classList.contains('show');hideAllPops();el.classList.toggle('show',open);if(open)placePop(el,t);return}
    if(id==='img'){hideAllPops();$('#fileImg').click();return}
    tool=id;if(id!=='select')sel=null;hideAllPops();toolsUI();return}
  if(t.dataset.color){
    const c=t.dataset.color;
    if(tool==='hl')hlColor=c;else color=c;
    if(sel!=null&&tool==='select'){P().objs[sel].c=c;snap()}
    if(t.closest('#palpop'))hideAllPops();
    toolsUI();return}
  if(t.dataset.size){sizeIdx=+t.dataset.size;toolsUI();return}
  if(t.dataset.bg){P().bg=t.dataset.bg;snap();return}
});
function tblAdj(dr,dk){
  const so=sel!=null?P().objs[sel]:null;
  if(tool==='select'&&so&&so.t==='table'){so.r=Math.max(1,Math.min(20,so.r+dr));so.k=Math.max(1,Math.min(12,so.k+dk));snap()}
  else{tblR=Math.max(1,Math.min(20,tblR+dr));tblK=Math.max(1,Math.min(12,tblK+dk));ui()}
}
$('#trm').onclick=()=>tblAdj(-1,0);$('#trp').onclick=()=>tblAdj(1,0);$('#tkm').onclick=()=>tblAdj(0,-1);$('#tkp').onclick=()=>tblAdj(0,1);
$('#slock').onclick=()=>{if(sel!=null){P().objs[sel].lock=true;sel=null;snap();toast('Gesperrt – wird mit „Alles entsperren“ (Seiten-Menü) wieder frei')}};
$('#punlock').onclick=()=>{hideAllPops();let n=0;P().objs.forEach(o=>{if(o.lock){delete o.lock;n++}});if(n)snap();toast(n?n+' Objekt(e) entsperrt':'Nichts gesperrt')};
$('#mtc').onclick=()=>{multiOn=!multiOn;$('#mtc').classList.toggle('on',multiOn);toast(multiOn?'Mehrfach-Touch an: mehrere Finger zeichnen gleichzeitig (jeder in eigener Farbe)':'Mehrfach-Touch aus',3500)};
$('#snp').onclick=()=>{snapOn=!snapOn;$('#snp').classList.toggle('on',snapOn);toast(snapOn?'Gerade Linie an: Stift am Ende kurz ruhig halten':'Gerade Linie aus',3500)};
$('#lbl').onclick=()=>{const on=document.documentElement.classList.toggle('labels');try{localStorage.setItem('tafel-labels',on?'1':'0')}catch(e){}$('#lbl').classList.toggle('on',on);hideAllPops()};
$('#srf').onclick=()=>{const dark=document.documentElement.classList.toggle('surround-dark');try{localStorage.setItem('tafel-surround',dark?'dark':'light')}catch(e){}$('#srf').classList.toggle('on',dark);hideAllPops()};
$('#intr').onclick=()=>{hideAllPops();window.__intro&&window.__intro(true)};
$('#undo').onclick=undo;$('#redo').onclick=redo;
$('#pprev').onclick=()=>setPage(S.cur-1);$('#pnext').onclick=()=>setPage(S.cur+1);$('#padd').onclick=()=>addPage();
$('#pdel').onclick=()=>{hideAllPops();askDelPage(S.cur)};
$('#pdel2').onclick=()=>{hideAllPops();askDelPage(S.cur)};
$('#pclr').onclick=()=>{hideAllPops();P().objs=[];P().bgImg=null;sel=null;snap()};
$('#sdel').onclick=()=>{if(sel!=null){P().objs.splice(sel,1);sel=null;snap()}};
$('#sbig').onclick=()=>{if(sel!=null){scaleObj(P().objs[sel],1.15);snap()}};
$('#ssml').onclick=()=>{if(sel!=null){scaleObj(P().objs[sel],1/1.15);snap()}};
$('#sdup').onclick=()=>{if(sel!=null){const o=JSON.parse(JSON.stringify(P().objs[sel]));move(o,40,40);P().objs.push(o);sel=P().objs.length-1;snap()}};
$('#dock').onclick=()=>{hideAllPops();document.body.classList.toggle('right');try{localStorage.setItem('tafel-dock',document.body.classList.contains('right')?'right':'left')}catch(e){}fit()};
function applyTheme(){
  document.body.classList.toggle('theme-board',S.theme==='board');
  if(S.theme==='board'&&color==='#111111')color='#ffffff';
  if(S.theme==='white'&&color==='#ffffff')color='#111111';
  toolsUI()}
$('#thm').onclick=()=>{
  S.theme=S.theme==='white'?'board':'white';
  // Schwarz ↔ Weiß tauschen, damit vorhandene Striche und Texte lesbar bleiben
  const from=S.theme==='board'?'#111111':'#ffffff',to=S.theme==='board'?'#ffffff':'#111111';
  const gFrom=S.theme==='board'?'#6b7280':'#c3cad6',gTo=S.theme==='board'?'#c3cad6':'#6b7280';
  S.pages.forEach(p=>{let n=0;p.objs.forEach(o=>{const c=o.c&&o.c.toLowerCase();if(c===from){o.c=to;n++}else if(c===gFrom){o.c=gTo;n++}});if(n){p.hist=[JSON.stringify(p.objs)];p.hi=0}});
  applyTheme();changed()};

/* Seitenübersicht */
let thT;
function thumbsDirty(){if(!$('#panel').classList.contains('show'))return;clearTimeout(thT);thT=setTimeout(buildThumbs,250)}
function buildThumbs(){
  const pn=$('#panel');pn.innerHTML='';
  S.pages.forEach((p,i)=>{
    const d=document.createElement('div');d.className='th'+(i===S.cur?' cur':'');
    const c=document.createElement('canvas');c.width=W/6;c.height=H/6;const x=c.getContext('2d');x.save();x.scale(1/6,1/6);render(x,p,false);x.restore();
    const b=document.createElement('b');b.textContent=i+1;
    const x2=document.createElement('button');x2.className='x';x2.title='Seite löschen';x2.setAttribute('aria-label','Seite '+(i+1)+' löschen');x2.innerHTML=ic('close',14);
    x2.onclick=e=>{e.stopPropagation();askDelPage(i)};
    d.append(c,b,x2);d.onclick=()=>setPage(i);pn.appendChild(d)});
}
function askDelPage(i){
  const only=S.pages.length===1;
  if(!confirm(only?'Die einzige Seite kann nicht entfernt werden. Inhalt der Seite leeren?':`Seite ${i+1} von ${S.pages.length} löschen?`))return;
  const gone=only?null:{page:S.pages[i],idx:i};
  S.cur=i;sel=null;delPage();
  if($('#panel').classList.contains('show'))buildThumbs();
  if(gone)toastAction('Seite gelöscht','Rückgängig',()=>{S.pages.splice(gone.idx,0,gone.page);setPage(gone.idx);if($('#panel').classList.contains('show'))buildThumbs()},10000);
}
$('#pthumbs').onclick=()=>{hideAllPops();const pn=$('#panel');pn.classList.toggle('show');if(pn.classList.contains('show'))buildThumbs()};

/* Lineal */
/* Bildschirm-Pixel pro Millimeter (Standard: 96 dpi, über „cm“ am Lineal kalibrierbar) */
const pxmmGet=()=>{try{const v=+localStorage.getItem('tafel-pxmm');return v>1&&v<20?v:96/25.4}catch(e){return 96/25.4}};
const ruler=$('#ruler');let rot=0;
function buildRuler(){
  const pxmm=pxmmGet();let s='';
  for(let i=0;i<=200;i++){const x=2+i*pxmm,len=i%10===0?26:i%5===0?18:11;s+=`<line x1="${x}" y1="0" x2="${x}" y2="${len}" stroke="#333" stroke-width="${i%10===0?1.6:1}"/>`;if(i%10===0&&i>0&&i<200)s+=`<text x="${x}" y="46" font-size="16" text-anchor="middle" fill="#222" font-family="Segoe UI,sans-serif">${i/10}</text>`}
  const w=Math.round(4+200*pxmm);ruler.style.width=w+'px';
  ruler.innerHTML=`<svg width="${w}" height="72">${s}</svg><button class="rb" style="left:8px" data-r="-15" aria-label="Links drehen">${ic('rotL',18)}</button><button class="rb" style="left:54px" data-r="15" aria-label="Rechts drehen">${ic('rotR',18)}</button><button class="rb" style="left:100px;font-size:13px;font-weight:700" data-r="k" title="Kalibrieren: Länge mit echtem Lineal nachmessen" aria-label="Kalibrieren">cm</button><button class="rb" style="right:8px" data-r="x" aria-label="Schließen">${ic('close',18)}</button>`;
}
(function(){
  buildRuler();
  let drag=null;
  ruler.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX-ruler.offsetLeft,y:e.clientY-ruler.offsetTop};ruler.setPointerCapture(e.pointerId)});
  ruler.addEventListener('pointermove',e=>{if(!drag)return;ruler.style.left=e.clientX-drag.x+'px';ruler.style.top=e.clientY-drag.y+'px'});
  ruler.addEventListener('pointerup',()=>drag=null);
  ruler.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.r==='x')ruler.style.display='none';
    else if(b.dataset.r==='k'){
      const m=prompt('Kalibrieren: Miss auf dem Board mit einem echten Lineal, wie lang die Skala von 0 bis 20 am Bildschirm-Lineal ist.\nWie viele Zentimeter sind es? (Soll: 20)',20);
      const v=m==null?NaN:parseFloat(String(m).replace(',','.'));
      if(v>2&&v<200){try{localStorage.setItem('tafel-pxmm',String(pxmmGet()*20/v))}catch(e){}buildRuler();window.__rebuildTri&&window.__rebuildTri();toast('Lineal kalibriert – bitte noch einmal nachmessen')}
    }
    else{rot+=+b.dataset.r;ruler.style.transform=`rotate(${rot}deg)`}});
})();
$('#rul').onclick=()=>{hideAllPops();ruler.style.display=ruler.style.display==='block'?'none':'block'};

/* Vorhang */
const cur=$('#curtain');
$('#cur').onclick=()=>{hideAllPops();cur.style.display=cur.style.display==='block'?'none':'block'};
(function(){let d=false;const h=cur.querySelector('.h');
  h.addEventListener('pointerdown',e=>{d=true;h.setPointerCapture(e.pointerId);e.stopPropagation()});
  h.addEventListener('pointermove',e=>{if(!d)return;const r=wrap.getBoundingClientRect();cur.style.height=Math.max(0,Math.min(r.height,e.clientY-r.top))+'px'});
  h.addEventListener('pointerup',()=>d=false)})();

/* Timer */
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3)})}catch(e){}}
// „Timer“ im Hilfsmittel-Menü öffnet die Zeit-Scheibe (ein gemeinsamer Timer)
$('#tim').onclick=()=>{hideAllPops();const w=window.__widgets;if(w)w.openWidget(w.W.find(d=>d.id==='zeitscheibe'))};

/* Größe & Tastatur */
/* Schreibfläche: Breite 1920; die Höhe passt sich dem Fenster an (mindestens 16:9, höchstens 4:3), damit der Platz nach unten genutzt wird */
function fit(){
  const cs=getComputedStyle(stage),w=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(w<=0||h<=0)return;
  // Oberfläche verkleinern, wenn das Fenster niedrig ist (so bleibt die ganze Leiste erreichbar)
  uiScale=Math.max(.5,Math.min(1,innerHeight/800));
  $('#bar').style.zoom=uiScale===1?'':uiScale;
  document.documentElement.style.setProperty('--pmh',((innerHeight-24)/uiScale)+'px');
  document.documentElement.style.setProperty('--bmh',((innerHeight-24)/uiScale-14)+'px');
  const nh=Math.round(Math.max(1080,Math.min(1440,W*h/w)));
  if(nh!==H){H=nh;cv.height=H}
  scale=Math.max(.05,Math.min(w/W,h/H));
  wrap.style.width=W*scale+'px';wrap.style.height=H*scale+'px';dirty=true;thumbsDirty&&thumbsDirty()}
new ResizeObserver(fit).observe(stage);
addEventListener('resize',()=>{fit();requestAnimationFrame(fit)});
addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA')return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo()}
  else if((k==='delete'||k==='backspace')&&sel!=null){P().objs.splice(sel,1);sel=null;snap()}
  else if(k==='arrowright'||k==='pagedown')setPage(S.cur+1);
  else if(k==='arrowleft'||k==='pageup')setPage(S.cur-1);
  else if(k==='escape'){sel=null;hideAllPops();ui()}
});

/* ---------- Start ---------- */
(async function init(){
  { const bar=$('#bar'); if(!$('#barscroll')){ const sc=document.createElement('div'); sc.id='barscroll'; [...bar.children].filter(e=>e.classList.contains('grp')).forEach(g=>sc.appendChild(g)); bar.insertBefore(sc,bar.firstChild) } }
  buildBar();
  try{if(localStorage.getItem('tafel-dock')==='right')document.body.classList.add('right')}catch(e){}
  try{const L=localStorage.getItem('tafel-labels')==='1',D=localStorage.getItem('tafel-surround')==='dark';document.documentElement.classList.toggle('labels',L);document.documentElement.classList.toggle('surround-dark',D);$('#lbl').classList.toggle('on',L);$('#srf').classList.toggle('on',D)}catch(e){}
  S.pages=[mkPage('plain')];
  try{const saved=await kvGet('state');if(saved)restore(saved)}catch(e){}
  hydrate();toolsUI();fit();loop();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.__tafel={S,P,get tool(){return tool},set tool(v){tool=v;toolsUI()}};
})();
